# Top-of-page identity and contact details.
#
# name_first + name_last is the displayed name, on both the website and the
# PDF. name_short is the compact form used only where a full name would be
# unwieldy — the browser tab titles.
name_first: Duncan
name_last: Cameron-Steinke
name_short: Duncan Steinke

# Rendered as the contact line under the name. Plain text; edit freely.
contact: "BC, Canada · (647) 936-0900"
email: dcameronsteinke@gmail.com

# Host only, no scheme — the PDF prints it as-is and links it over https.
# PDF only: the website doesn't print its own address back at the reader.
website: duncancs.ca

# Short intro paragraph. Markdown is allowed.
lead: >-
  AI researcher and recent MSc graduate in Mathematics and Statistics, specializing in uncertainty quantification for deep learning and deep-learning-enhanced stochastic forecasting with hidden Markov models, with applications to financial markets.<br>
  Three years in data and analytics, most recently as a senior data engineer at ServiceTitan, and two years as co-founder and CTO of an analytics startup.

# Social links. Each needs a Font Awesome icon class and a URL.
# `label` is the visible text on the PDF contact line (the website shows the
# icon only). Applicant tracking systems read the printed text, not the href,
# so labels carry the full https:// URL rather than a bare host.
# `name` selects the PDF's inline SVG mark — see _includes/social-icon.html for
# the accepted values and why it is an SVG rather than an icon font.
# Use "#!" as a placeholder until you have a real link.
socials:
  - icon: fab fa-linkedin-in
    name: linkedin
    url: "https://linkedin.com/in/duncan-cameron-steinke/"
  - icon: fab fa-github
    name: github
    url: "https://github.com/DuncanCSt"
  # No `label`, so it stays off the PDF contact line. Font Awesome 6.3 (loaded
  # in _layouts/default.html) predates the Google Scholar brand icon, so this
  # uses the graduation cap.
  - icon: fas fa-graduation-cap
    url: "https://scholar.google.com/citations?user=SP_OriwAAAAJ&hl=en&oi=ao"
