# Top-of-page identity and contact details.
#
# name_first + name_last is the displayed name, on both the website and the
# PDF. name_short is the compact form used only where a full name would be
# unwieldy — the browser tab titles.
name_first: Duncan
name_last: Cameron-Steinke
name_short: Duncan Steinke

# Rendered as the contact line under the name. Plain text; edit freely.
