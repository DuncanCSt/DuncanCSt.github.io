# One entry per project, newest first.
#
# Fields:
#   name                 required
#   slug                 required — short id used for URLs and doc deep links
#                        (e.g. slug "chord" -> /projects/chord/thesis/ and the
#                        modal deep link #/doc/chord-thesis)
#   context              optional — where the work sat (thesis, coursework,
#                        personal, affiliation)
#   start, end           "YYYY-MM"; use "present" for end to show "Present"
#   tagline              optional one-line hook shown on the card, above the
#                        tech pills. Keep it to a single sentence.
#   figure               optional card thumbnail (rendered 16:10, cropped to
#                        fill). Site-absolute path, e.g. /assets/img/projects/x.png
#   figure_alt           optional alt text for that image
#   docs                 optional list of { label, kind, url, external }
#                          kind -> thesis|slides|poster|report|demo|code
#                                  (drives the button icon)
#                          internal urls open in the doc modal;
#                          external: true opens in a new tab instead
#
#                        A .pdf url opens in the modal on desktop, but in a new
#                        tab below 992px — mobile browsers render PDFs poorly
#                        (or not at all) inside an iframe.
#
#                        PDFs that are not yet in assets/docs/ are skipped
#                        automatically, so a missing file never renders a
#                        broken button. Drop the file in and it appears.
#   tech                 optional list of strings
#   bullets              list of { long, short }
#                          long  -> shown on the website
#                          short -> shown in the PDF
#                          omit `short` on a bullet to keep it OFF the PDF
#   pdf                  optional — set `pdf: false` to drop this project from
#                        the PDF while keeping it on the website. Omit it and
#                        the project is included.

- name: Belief Distribution Learning
  slug: bdl
  context: Research paper (in preparation)
  start: "2026-03"
  end: present
  figure: /assets/img/projects/deep_learning_with_uncertainty.svg
  figure_alt: "Figure placeholder for the Belief Distribution Learning project"
  tagline: >-
    A novel deep learning algorithm with learned predictive uncertainty. Paper pending.
  docs:
    - label: Poster
      kind: poster
      url: /bdl/
    - label: Slides
      kind: slides
      url: /projects/bdl/slides/
      mobile_url: /assets/docs/BDL_Presentation.pdf
  tech:
    - Python
    - TensorFlow
    - Keras
    - Machine Learning
    - Deep Learning
    - Uncertainty Quantification
  bullets:
    - long: >-
        Derived a deep learning algorithm grounded in belief theory by combining
        Subjective Logic (Jøsang, 2016) with Evidential Deep Learning
        (Sensoy et al., 2018).
      short: >-
        Created a novel deep learning algorithm grounded in belief theory by combining Subjective Logic with Evidential Deep Learning.
    - long: >-
        Introduced per-label Dirichlet modeling, estimating uncertainty independently for each label rather than as a single distribution over the full label simplex.
    - long: >-
        Evaluated against published Label Distribution Learning algorithms on standard benchmark datasets, demonstrating improved accuracy and better-calibrated uncertainty estimates.
      short: >-
        Evaluated against published Label Distribution Learning algorithms, demonstrating improved accuracy and better-calibrated uncertainty estimates.

- name: Hybrid Stochastic–Deep Learning Volatility Forecasting
  slug: hmm
  context: Research project
  start: "2025-07"
  end: "2026-04"
  figure: /assets/img/projects/time_series_forecasting.svg
  figure_alt: "Figure placeholder for the HMM volatility forecasting project"
  tagline: >-
    Stochastic regime-switching model of TSX volatility, combining a hidden Markov model with uncertainty-aware deep learning covariates.
  docs:
    - label: Report
      kind: report
      url: /assets/docs/TSX_Forecast_Report.pdf
    - label: Slides
      kind: slides
      url: /assets/docs/HMM_Presentation.pdf
  tech:
    - Python
    - R
    - Hidden Markov Models
    - Stochastic Processes
    - Time Series Forecasting
    - Deep Learning
  bullets:
    - long: >-
        Modelled the TSX as a stochastic regime-switching process, fitting a
        three-state hidden Markov model to weekly log returns to identify Crash,
        Volatile and Growth volatility regimes.
      short: >-
        Modelled TSX volatility as a stochastic regime-switching process with a
        hidden Markov model.
    - long: >-
        Extended the hidden Markov model package hmmTMB to forecast regime
        probabilities, and paired it with an RNN with an evidential deep
        learning (EDL) output layer. The RNN learned from present-day TSX, oil,
        gold, copper and S&P 500 data and reported the uncertainty of each
        prediction.
      short: >-
        Added forecasting to the hidden Markov model package hmmTMB and coupled
        it with an uncertainty-aware deep learning model using a custom
        loss function.
    - long: >-
        Designed a custom loss function that made the EDL uncertainty more
        reliable, then built a hybrid that uses the EDL forecast when confidence
        is high and falls back to the stochastic HMM otherwise, roughly halving
        the HMM's maximum loss in extreme markets.
      short: >-
        Demonstrated improved responsiveness to covariate signals while staying
        robust to extreme market conditions by using epistemic uncertainty.

