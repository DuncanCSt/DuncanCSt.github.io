# One entry per project, newest first.
#
# Fields:
#   name                 required
#   slug                 required — short id used for URLs and doc deep links
#                        (e.g. slug "chord" -> /projects/chord/thesis/ and the
#                        modal deep link #/doc/chord-thesis)
#   context              optional — where the work sat (thesis, coursework,
#                        personal, affiliation)
#   start, end           "YYYY-MM"; use "present" for end to show "Present"
#   tagline              optional one-line hook shown on the card, above the
#                        tech pills. Keep it to a single sentence.
#   figure               optional card thumbnail (rendered 16:10, cropped to
#                        fill). Site-absolute path, e.g. /assets/img/projects/x.png
#   figure_alt           optional alt text for that image
#   docs                 optional list of { label, kind, url, external }
#                          kind -> thesis|slides|poster|report|demo|code
#                                  (drives the button icon)
#                          internal urls open in the doc modal;
#                          external: true opens in a new tab instead
#
#                        A .pdf url opens in the modal on desktop, but in a new
#                        tab below 992px — mobile browsers render PDFs poorly
#                        (or not at all) inside an iframe.
#
#                        PDFs that are not yet in assets/docs/ are skipped
#                        automatically, so a missing file never renders a
#                        broken button. Drop the file in and it appears.
#   tech                 optional list of strings
#   bullets              list of { long, short }
#                          long  -> shown on the website
#                          short -> shown in the PDF
#                          omit `short` on a bullet to keep it OFF the PDF
#   pdf                  optional — set `pdf: false` to drop this project from
#                        the PDF while keeping it on the website. Omit it and
#                        the project is included.

