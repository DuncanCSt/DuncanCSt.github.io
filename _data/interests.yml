paragraphs:
  - >-
    Outside of my research, I enjoy canoe tripping and backcountry camping. My outdoor highlights include a 2-week trip by float plane to the Bloodvein River in Northern Manitoba, multiple trips to Algonquin Park and Temagami in Northern Ontario, Nanika-Kidprice in Northern BC, and a mountaineering trip to the Peruvian Andes.
  - >-
    After high school I deferred university for a year and spent 12 months living on a 39-foot sailboat, which my father and I navigated from Toronto to the Caribbean and across the Pacific to Australia. I love remote trips for their mental and physical challenges and the reward of accomplishing a goal with friends and family.
    


