# One entry per role, newest first.
#
# Fields:
#   role, company        required
#   group                optional heading this role is filed under (e.g.
#                        Industry, Entrepreneurship, Research, Co-op).
#                        WEBSITE ONLY — the PDF prints every role under one
#                        "Experience" heading, because resume parsers segment
#                        on standard section names and these aren't any.
#                        Groups render in the order they first appear in this
#                        file, and all roles sharing a group are listed
#                        together — so keep each group's entries contiguous.
#                        Omit it and the role renders without a heading.
#   location             optional
#   start, end           "YYYY-MM"; use "present" for end to show "Present"
#   links                optional list of { label, url } — url may be internal
#                        (e.g. /projects/foo/) or an external https:// link
#   tech                 optional list of strings, shown as pills under the
#                        date range on both the website and the PDF.
#                        Only add tools actually named in that role's bullets;
#                        an empty/omitted list is preferable to guessing.
#   bullets              list of { long, short }
#                          long  -> shown on the website
#                          short -> shown in the PDF
#                          omit `short` on a bullet to keep it OFF the PDF
#   pdf                  optional — set `pdf: false` to drop this role from the
#                        PDF while keeping it on the website. Omit it and the
#                        role is included. On the website, a group whose roles
#                        are all excluded loses its heading too.
#   page_break           optional — set `page_break: true` to start a new PDF
#                        page with this role. PDF only; the website ignores it.

# ============================================================================

